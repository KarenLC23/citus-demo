        - name: EFFECTIVE_IO_CONCURRENCY
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: effective_io_concurrency
        - name: RANDOM_PAGE_COST
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: random_page_cost
        - name: MAX_WAL_SIZE
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: max_wal_size
        - name: MIN_WAL_SIZE
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: min_wal_size
        args:
        - -c
        - shared_buffers=$(SHARED_BUFFERS)
        - -c
        - work_mem=$(WORK_MEM)
        - -c
        - maintenance_work_mem=$(MAINTENANCE_WORK_MEM)
        - -c
        - effective_cache_size=$(EFFECTIVE_CACHE_SIZE)
        - -c
        - effective_io_concurrency=$(EFFECTIVE_IO_CONCURRENCY)
        - -c
        - random_page_cost=$(RANDOM_PAGE_COST)
        - -c
        - max_wal_size=$(MAX_WAL_SIZE)
        - -c
        - min_wal_size=$(MIN_WAL_SIZE)
        volumeMounts:
        - mountPath: /var/lib/postgresql
          name: citusv2-prueba-worker-2-pgdata
        - mountPath: /docker-entrypoint-initdb.d
          name: init-scripts
      volumes:
      - name: init-scripts
        configMap:
          name: citusv2-prueba-init
          defaultMode: 493
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
  - metadata:
      name: citusv2-prueba-worker-2-pgdata
      labels:
        application: citusv2-prueba
        citus-role: worker
        citus-group: '2'
    spec:
      storageClassName: standard
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  updateStrategy:
    type: RollingUpdate
---
apiVersion: batch/v1
kind: Job
metadata:
  name: citusv2-prueba-init-cluster
  labels:
    application: citusv2-prueba
    app.kubernetes.io/part-of: citusv2-prueba
  namespace: citus-demo
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        application: citusv2-prueba
        job-name: citusv2-prueba-init-cluster
    spec:
      serviceAccountName: pipeline
      restartPolicy: OnFailure
      initContainers:
      - name: wait-coordinator
        image: citusdata/citus:14.0.0
        command:
        - sh
        - -c
        - "echo \"[wait] Aguardando coordinator ficar pronto...\"\nuntil pg_isready\
          \ -h citusv2-prueba-coordinator -p 5432 -U postgres; do\n  echo \"[wait]\
          \ Coordinator nao esta pronto, tentando novamente em 5s...\"\n  sleep 5\n\
          done\necho \"[wait] Coordinator pronto!\"\n\necho \"[wait] Aguardando worker-1\
          \ ficar pronto...\"\nuntil pg_isready -h citusv2-prueba-worker-1 -p 5432\
          \ -U postgres; do\n  echo \"[wait] Worker-1 nao esta pronto, tentando novamente\
          \ em 5s...\"\n  sleep 5\ndone\necho \"[wait] Worker-1 pronto!\"\n\necho\
          \ \"[wait] Aguardando worker-2 ficar pronto...\"\nuntil pg_isready -h citusv2-prueba-worker-2\
          \ -p 5432 -U postgres; do\n  echo \"[wait] Worker-2 nao esta pronto, tentando\
          \ novamente em 5s...\"\n  sleep 5\ndone\necho \"[wait] Worker-2 pronto!\"\
          \n\n# Aguardar 15s extras para os entrypoints configurarem pg_hba.conf e\
          \ citus.node_conninfo\necho \"[wait] Aguardando 15s para entrypoints finalizarem\
          \ configuracao...\"\nsleep 15\necho \"[wait] Todos os nos prontos para configuracao\
          \ do cluster!\"\n"
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: citusv2-prueba-secret
              key: POSTGRES_PASSWORD
      containers:
      - name: init-cluster
        image: citusdata/citus:14.0.0
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: citusv2-prueba-secret
              key: POSTGRES_PASSWORD
        command:
        - sh
        - -c
        - "echo \"=============================================\"\necho \"[init] Configurando\
          \ cluster Citus v2 prueba\"\necho \"=============================================\"\
          \n\n# Registrar o coordinator\necho \"[init] Registrando coordinator...\"\
          \npsql -h citusv2-prueba-coordinator -U postgres -d citus -c \\\n  \"SELECT\
          \ citus_set_coordinator_host('citusv2-prueba-coordinator', 5432);\"\n\n\
          # Registrar workers\necho \"[init] Registrando worker-1...\"\npsql -h citusv2-prueba-coordinator\
          \ -U postgres -d citus -c \\\n  \"SELECT * FROM citus_add_node('citusv2-prueba-worker-1',\
          \ 5432);\"\n\necho \"[init] Registrando worker-2...\"\npsql -h citusv2-prueba-coordinator\
          \ -U postgres -d citus -c \\\n  \"SELECT * FROM citus_add_node('citusv2-prueba-worker-2',\
          \ 5432);\"\n\n# Verificar cluster\necho \"\"\necho \"[init] Workers ativos\
          \ no cluster:\"\npsql -h citusv2-prueba-coordinator -U postgres -d citus\
          \ -c \\\n  \"SELECT * FROM citus_get_active_worker_nodes();\"\n\necho \"\
          \"\necho \"[init] Versao do Citus:\"\npsql -h citusv2-prueba-coordinator\
          \ -U postgres -d citus -c \\\n  \"SELECT citus_version();\"\n\necho \"\"\
          \necho \"=============================================\"\necho \"[init]\
          \ Cluster Citus v2 prueba configurado!\"\necho \"=============================================\"\
          \n"
