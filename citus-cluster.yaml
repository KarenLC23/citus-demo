# YAML reorganizado de Citus listo para usar con Vault CSI
# Se elimina el Job de OpenBao y se prepara para montar secretos directamente desde Vault

apiVersion: v1
kind: Namespace
metadata:
  name: citus-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: citus-demo
  labels:
    app.kubernetes.io/part-of: citusv2-prueba
---
# SecretProviderClass para Vault
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vault-citus-demo
  namespace: citus-demo
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault-server.vault.svc:8200"  # Dirección del servidor Vault
    roleName: "citus-demo"  # Rol de Vault asignado a la app
    objects: |
      - objectName: POSTGRES_USER
        secretPath: kv/data/citus
        secretKey: username
      - objectName: POSTGRES_PASSWORD
        secretPath: kv/data/citus
        secretKey: password
      - objectName: POSTGRES_DB
        secretPath: kv/data/citus
        secretKey: database
---
# ConfigMap para scripts de inicialización
apiVersion: v1
kind: ConfigMap
metadata:
  name: citusv2-prueba-init
  namespace: citus-demo
  labels:
    application: citusv2-prueba
  annotations:
    argocd.argoproj.io/sync-wave: '2'
data:
  001-init-citus.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE EXTENSION IF NOT EXISTS citus;
      CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
      CREATE EXTENSION IF NOT EXISTS pgcrypto;
    EOSQL
    echo "[init] Citus y extensiones creadas con éxito."

---

# ConfigMap para parámetros no sensibles de Citus
apiVersion: v1
kind: ConfigMap
metadata:
  name: citusv2-prueba-config
  namespace: citus-demo
  labels:
    application: citusv2-prueba
  annotations:
    argocd.argoproj.io/sync-wave: '2'
data:
  shared_preload_libraries: citus,pg_stat_statements
  max_connections: '100'
  max_locks_per_transaction: '512'
  shared_buffers: 256MB
  work_mem: 4MB
  maintenance_work_mem: 64MB
  effective_cache_size: 512MB
  effective_io_concurrency: '2'
  random_page_cost: '4'
  max_wal_size: 1GB
  min_wal_size: 80MB
  pg_hba_conf: |
    local   all       all                 trust
    host    all       all   0.0.0.0/0     md5
    host    replication all 0.0.0.0/0     md5

---

# StatefulSet para coordinator con volumen CSI montando secretos y evitando root
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: citusv2-prueba-coordinator
  namespace: citus-demo
  labels:
    application: citusv2-prueba
    cluster-name: citusv2-prueba-cluster
    citus-role: coordinator
spec:
  replicas: 1
  serviceName: citusv2-prueba-coordinator
  selector:
    matchLabels:
      application: citusv2-prueba
      cluster-name: citusv2-prueba-cluster
      citus-role: coordinator
  template:
    metadata:
      labels:
        application: citusv2-prueba
        cluster-name: citusv2-prueba-cluster
        citus-role: coordinator
    spec:
      serviceAccountName: pipeline
      containers:
      - name: coordinator
        image: citusdata/citus:14.0.0
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          fsGroup: 999
        env:
        - name: POSTGRES_SHARED_PRELOAD_LIBRARIES
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: shared_preload_libraries
        command: ["/bin/sh", "-c"]
        args:
        - export POSTGRES_USER=$(cat /mnt/secrets/POSTGRES_USER) &&
          export POSTGRES_PASSWORD=$(cat /mnt/secrets/POSTGRES_PASSWORD) &&
          export POSTGRES_DB=$(cat /mnt/secrets/POSTGRES_DB) &&
          exec postgres -c shared_preload_libraries=$POSTGRES_SHARED_PRELOAD_LIBRARIES
        volumeMounts:
        - name: secrets
          mountPath: /mnt/secrets
      volumes:
      - name: secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: vault-citus-demo
  volumeClaimTemplates:
  - metadata:
      name: citusv2-prueba-coordinator-pgdata
    spec:
      storageClassName: standard
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi