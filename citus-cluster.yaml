# Manifiesto local ajustado para Minikube + OpenBao
# - No incluye password plano.
# - El Secret citusv2-prueba-secret lo crea el Job sync-citus-secret-from-openbao leyendo OpenBao.
# - Imagen privada reemplazada por citusdata/citus:14.0.0.
# - storageClassName ajustado a standard para Minikube.
# - Recursos y storage reducidos para laboratorio local.
---
apiVersion: v1
kind: Namespace
metadata:
  name: citus-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: citus-demo
  labels:
    app.kubernetes.io/part-of: citusv2-prueba
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: citus-secret-sync-sa
  namespace: citus-demo
  labels:
    app.kubernetes.io/part-of: citusv2-prueba
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: citus-secret-sync-role
  namespace: citus-demo
  labels:
    app.kubernetes.io/part-of: citusv2-prueba
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: citus-secret-sync-rolebinding
  namespace: citus-demo
  labels:
    app.kubernetes.io/part-of: citusv2-prueba
subjects:
- kind: ServiceAccount
  name: citus-secret-sync-sa
  namespace: citus-demo
roleRef:
  kind: Role
  name: citus-secret-sync-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-citus-secret-from-openbao
  namespace: citus-demo
  labels:
    application: citusv2-prueba
    app.kubernetes.io/part-of: citusv2-prueba
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        application: citusv2-prueba
        job-name: sync-citus-secret-from-openbao
    spec:
      serviceAccountName: citus-secret-sync-sa
      restartPolicy: Never
      initContainers:
      - name: read-from-openbao
        image: quay.io/openbao/openbao:2.5.4
        imagePullPolicy: IfNotPresent
        env:
        - name: BAO_ADDR
          value: http://openbao.openbao.svc.cluster.local:8200
        command:
        - sh
        - -c
        - 'set -e


          echo "[openbao] Leyendo JWT del ServiceAccount..."

          JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"


          echo "[openbao] Login con Kubernetes Auth..."

          BAO_TOKEN="$(bao write -field=token auth/kubernetes/login role=citus-demo-role
          jwt="$JWT")"

          export BAO_TOKEN


          echo "[openbao] Leyendo secretos de Citus..."

          bao kv get -field=POSTGRES_USER secret/apps/citus/dev > /work/POSTGRES_USER

          bao kv get -field=POSTGRES_PASSWORD secret/apps/citus/dev > /work/POSTGRES_PASSWORD

          bao kv get -field=POSTGRES_DB secret/apps/citus/dev > /work/POSTGRES_DB


          echo "[openbao] Secretos leídos correctamente."

          '
        volumeMounts:
        - name: workdir
          mountPath: /work
      containers:
      - name: create-kubernetes-secret
        image: bitnami/kubectl:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - "set -e\n\necho \"[k8s] Creando/actualizando Secret citusv2-prueba-secret...\"\
          \nkubectl create secret generic citusv2-prueba-secret \\\n  --from-file=POSTGRES_USER=/work/POSTGRES_USER\
          \ \\\n  --from-file=POSTGRES_PASSWORD=/work/POSTGRES_PASSWORD \\\n  --from-file=POSTGRES_DB=/work/POSTGRES_DB\
          \ \\\n  -n citus-demo \\\n  --dry-run=client -o yaml | kubectl apply -f\
          \ -\n\necho \"[k8s] Secret citusv2-prueba-secret creado/actualizado.\"\n"
        volumeMounts:
        - name: workdir
          mountPath: /work
      volumes:
      - name: workdir
        emptyDir:
          medium: Memory
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: citusv2-prueba-config
  labels:
    application: citusv2-prueba
    cluster-name: citusv2-prueba-cluster
    app.kubernetes.io/part-of: citusv2-prueba
  namespace: citus-demo
  annotations:
    argocd.argoproj.io/sync-wave: '2'
data:
  shared_preload_libraries: citus,pg_stat_statements
  max_connections: '100'
  max_locks_per_transaction: '512'
  shared_buffers: 256MB
  work_mem: 4MB
  maintenance_work_mem: 64MB
  effective_cache_size: 512MB
  effective_io_concurrency: '2'
  random_page_cost: '4'
  max_wal_size: 1GB
  min_wal_size: 80MB
  pg_hba_conf: '# TYPE  DATABASE  USER  ADDRESS       METHOD

    local   all       all                 trust

    host    all       all   0.0.0.0/0     md5

    host    replication all 0.0.0.0/0     md5

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: citusv2-prueba-init
  labels:
    application: citusv2-prueba
    app.kubernetes.io/part-of: citusv2-prueba
  namespace: citus-demo
  annotations:
    argocd.argoproj.io/sync-wave: '2'
data:
  001-init-citus.sh: "#!/bin/bash\nset -e\n\n# Compatibilidade OpenShift — UID aleatorio\n\
    if [[ $UID -ge 10000 ]]; then\n    GID=$(id -g)\n    sed -e \"s/^postgres:x:[^:]*:[^:]*:/postgres:x:$UID:$GID:/\"\
    \ /etc/passwd > /tmp/passwd\n    cat /tmp/passwd > /etc/passwd\n    rm /tmp/passwd\n\
    fi\n\n# Criar extensao Citus e extensoes uteis\npsql -v ON_ERROR_STOP=1 --username\
    \ \"$POSTGRES_USER\" --dbname \"$POSTGRES_DB\" <<-EOSQL\n    CREATE EXTENSION\
    \ IF NOT EXISTS citus;\n    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;\n\
    \    CREATE EXTENSION IF NOT EXISTS pgcrypto;\nEOSQL\n\necho \"[init] Citus e\
    \ extensoes criadas com sucesso no banco $POSTGRES_DB\"\n"
---
apiVersion: v1
kind: Service
metadata:
  name: citusv2-prueba-coordinator
  labels:
    application: citusv2-prueba
    cluster-name: citusv2-prueba-cluster
    citus-role: coordinator
    app.kubernetes.io/part-of: citusv2-prueba
  namespace: citus-demo
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  ports:
  - port: 5432
    protocol: TCP
    targetPort: 5432
    name: postgresql
  selector:
    application: citusv2-prueba
    cluster-name: citusv2-prueba-cluster
    citus-role: coordinator
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: citusv2-prueba-worker-1
  labels:
    application: citusv2-prueba
    cluster-name: citusv2-prueba-cluster
    citus-role: worker
    citus-group: '1'
    app.kubernetes.io/part-of: citusv2-prueba
  namespace: citus-demo
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  ports:
  - port: 5432
    protocol: TCP
    targetPort: 5432
    name: postgresql
  selector:
    application: citusv2-prueba
    cluster-name: citusv2-prueba-cluster
    citus-role: worker
    citus-group: '1'
