# YAML reorganizado de Citus listo para usar con Vault CSI
# Se elimina el Job de OpenBao y se prepara para montar secretos directamente desde Vault

apiVersion: v1
kind: Namespace
metadata:
  name: citus-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: citus-demo
  labels:
    app.kubernetes.io/part-of: citusv2-prueba
---
# SecretProviderClass para Vault
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vault-citus-demo
  namespace: citus-demo
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault-server.vault.svc:8200"  # Dirección del servidor Vault
    roleName: "citus-demo"  # Rol de Vault asignado a la app
    objects: |
      - objectName: POSTGRES_USER
        secretPath: kv/data/citus
        secretKey: username
      - objectName: POSTGRES_PASSWORD
        secretPath: kv/data/citus
        secretKey: password
      - objectName: POSTGRES_DB
        secretPath: kv/data/citus
        secretKey: database
---
# ConfigMap para scripts de inicialización
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: citusv2-prueba-coordinator
  namespace: citus-demo
  labels:
    application: citusv2-prueba
    cluster-name: citusv2-prueba-cluster
    citus-role: coordinator
spec:
  replicas: 1
  serviceName: citusv2-prueba-coordinator
  selector:
    matchLabels:
      application: citusv2-prueba
      cluster-name: citusv2-prueba-cluster
      citus-role: coordinator
  template:
    metadata:
      labels:
        application: citusv2-prueba
        cluster-name: citusv2-prueba-cluster
        citus-role: coordinator
    spec:
      serviceAccountName: pipeline
      initContainers:
      - name: init-pgdata
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
        - mkdir -p /var/lib/postgresql/data && \
          chown -R 999:999 /var/lib/postgresql/data && \
          echo "PGDATA initialized"
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: citusv2-prueba-coordinator-pgdata
          mountPath: /var/lib/postgresql/data
      containers:
      - name: coordinator
        image: citusdata/citus:14.0.0
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          fsGroup: 999
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: placeholder
        - name: POSTGRES_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: placeholder
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: placeholder
        - name: POSTGRES_SHARED_PRELOAD_LIBRARIES
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: shared_preload_libraries
        command: ["/bin/sh", "-c"]
        args:
        - export POSTGRES_USER=$(cat /mnt/secrets/POSTGRES_USER) &&
          export POSTGRES_PASSWORD=$(cat /mnt/secrets/POSTGRES_PASSWORD) &&
          export POSTGRES_DB=$(cat /mnt/secrets/POSTGRES_DB) &&
          exec postgres -c shared_preload_libraries=$POSTGRES_SHARED_PRELOAD_LIBRARIES
        volumeMounts:
        - name: secrets
          mountPath: /mnt/secrets
        - name: citusv2-prueba-coordinator-pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: vault-citus-demo
  volumeClaimTemplates:
  - metadata:
      name: citusv2-prueba-coordinator-pgdata
    spec:
      storageClassName: standard
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 1Gi