---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: citusv2-prueba-coordinator
  labels:
    application: citusv2-prueba
    cluster-name: citusv2-prueba-cluster
    citus-role: coordinator
    app.kubernetes.io/part-of: citusv2-prueba
    app.openshift.io/runtime: postgresql
  namespace: citus-demo
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 5
  serviceName: citusv2-prueba-coordinator
  selector:
    matchLabels:
      application: citusv2-prueba
      cluster-name: citusv2-prueba-cluster
      citus-role: coordinator
  template:
    metadata:
      labels:
        application: citusv2-prueba
        cluster-name: citusv2-prueba-cluster
        citus-role: coordinator
    spec:
      serviceAccountName: pipeline
      initContainers:
      - name: fix-perms
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command:
        - sh
        - -c
        - |
          mkdir -p /var/lib/postgresql/data
          chown -R 999:999 /var/lib/postgresql
          chmod -R 0770 /var/lib/postgresql
        volumeMounts:
        - mountPath: /var/lib/postgresql
          name: citusv2-prueba-coordinator-pgdata
      containers:
      - name: citusv2-prueba-coordinator
        image: citusdata/citus:14.0.0
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        ports:
        - containerPort: 5432
          protocol: TCP
          name: postgresql
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - citus
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - citus
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: citusv2-prueba-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: citusv2-prueba-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: citusv2-prueba-secret
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_HOST_AUTH_METHOD
          value: md5
        - name: POSTGRES_INITDB_ARGS
          value: --auth-host=md5 --auth-local=trust --encoding=UTF8 --locale=en_US.UTF-8
            --data-checksums
        - name: POSTGRES_SHARED_PRELOAD_LIBRARIES
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: shared_preload_libraries
        - name: SHARED_BUFFERS
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: shared_buffers
        - name: WORK_MEM
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: work_mem
        - name: MAINTENANCE_WORK_MEM
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: maintenance_work_mem
        - name: EFFECTIVE_CACHE_SIZE
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: effective_cache_size
        - name: EFFECTIVE_IO_CONCURRENCY
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: effective_io_concurrency
        - name: RANDOM_PAGE_COST
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: random_page_cost
        - name: MAX_WAL_SIZE
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: max_wal_size
        - name: MIN_WAL_SIZE
          valueFrom:
            configMapKeyRef:
              name: citusv2-prueba-config
              key: min_wal_size
        args:
        - -c
        - shared_buffers=$(SHARED_BUFFERS)
        - -c
        - work_mem=$(WORK_MEM)
        - -c
        - maintenance_work_mem=$(MAINTENANCE_WORK_MEM)
        - -c
        - effective_cache_size=$(EFFECTIVE_CACHE_SIZE)
        - -c
        - effective_io_concurrency=$(EFFECTIVE_IO_CONCURRENCY)
        - -c
        - random_page_cost=$(RANDOM_PAGE_COST)
        - -c
        - max_wal_size=$(MAX_WAL_SIZE)
        - -c
        - min_wal_size=$(MIN_WAL_SIZE)
        volumeMounts:
        - mountPath: /var/lib/postgresql
          name: citusv2-prueba-coordinator-pgdata
        - mountPath: /docker-entrypoint-initdb.d
          name: init-scripts
      volumes:
      - name: init-scripts
        configMap:
          name: citusv2-prueba-init
          defaultMode: 493
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
  - metadata:
      name: citusv2-prueba-coordinator-pgdata
      labels:
        application: citusv2-prueba
        citus-role: coordinator
    spec:
      storageClassName: standard
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  updateStrategy:
    type: RollingUpdate
---
